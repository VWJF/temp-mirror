name: GitHub to GitLab push mirror
description: >
  Push-mirror the triggering GitHub ref to GitLab, matching GitLab push-mirror
  semantics. Use alone (GitHub → GitLab) or with GitLab's native push mirror
  for bidirectional sync.
author: VWJF

inputs:
  gitlab_url:
    description: HTTPS Git clone URL of the GitLab destination (e.g. https://gitlab.example.com/group/project.git).
    required: true
  gitlab_username:
    description: Username for GitLab HTTPS auth. For a personal/project access token, oauth2 is typical.
    required: false
    default: oauth2
  gitlab_token:
    description: GitLab personal, project, or group access token with write_repository (and permission to push protected branches).
    required: true
  github_token:
    description: Token used to clone GitHub (if private) and to query branch protection. Defaults to the workflow GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  only_protected_branches:
    description: >
      If true, only mirror GitHub-protected branches (classic protection and/or
      rulesets). Tags are still mirrored. Unprotected branch events are skipped.
    required: false
    default: "true"
  keep_divergent_refs:
    description: >
      If true, do not force-push or delete dest-only refs; fail when GitLab has
      diverged. If false, overwrite the destination ref (GitLab native default).
    required: false
    default: "true"
  skip_github_actors:
    description: >
      Comma- or newline-separated GitHub usernames (or App bots like app[bot])
      whose pushes should be ignored. For bidirectional mirroring, set this to
      the dedicated account used by GitLab's native push mirror. Leave empty
      for standalone GitHub → GitLab mirroring.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Skip configured GitHub actors
      id: skip_actor
      shell: bash
      env:
        SKIP_GITHUB_ACTORS: ${{ inputs.skip_github_actors }}
        ACTOR: ${{ github.actor }}
      run: bash "${{ github.action_path }}/scripts/skip-actor.sh"

    - name: Checkout source repository
      if: steps.skip_actor.outputs.skip != 'true'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
        lfs: true
        token: ${{ inputs.github_token }}
        ref: ${{ github.event.repository.default_branch }}

    - name: Mirror ref to GitLab
      if: steps.skip_actor.outputs.skip != 'true'
      shell: bash
      env:
        GITLAB_URL: ${{ inputs.gitlab_url }}
        GITLAB_USERNAME: ${{ inputs.gitlab_username }}
        GITLAB_TOKEN: ${{ inputs.gitlab_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ONLY_PROTECTED_BRANCHES: ${{ inputs.only_protected_branches }}
        KEEP_DIVERGENT_REFS: ${{ inputs.keep_divergent_refs }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/scripts/mirror.sh"
